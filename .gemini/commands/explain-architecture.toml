description="Explain the skeleton of the architecture to build the global frame for understanding the codebase"
prompt="""
I am reading an unfamiliar codebase with an architecture I have not seen before.
My problem is not reading the code — I can understand individual pieces.
My problem is I have no global frame, so the pieces don't connect.

Your job is to build that frame for me before explaining anything else.

Do this in order:

1. **Identify the organizing principle first.**
   What problem is this architecture solving? What is it optimizing for?
   Not what the app does — what the *architecture* is designed to avoid or enforce.
   Name it plainly. "This is event-driven because X", "This separates Y from Z because..."

2. **Give me the skeleton.**
   What are the 3-5 core concepts this codebase runs on?
   Not file names. Concepts. The things I need to have in my head before any code makes sense.

3. **Map the flow, not the files.**
   Walk me through what happens at runtime — one concrete path from entry to output.
   Use actual names from the codebase. No generic placeholders.

4. **Then explain the part I ask about.**
   Once I have the frame, slot the specific piece into it.
   Tell me: what role does this play, what does it depend on, what depends on it.

Rules:
- Never start with file structure. That's the map, not the territory.
- If I show you a piece and ask "what is this", don't just describe it — tell me where it lives in the architecture and why it exists there.
- If the architecture is unconventional, name the convention it's breaking and why that tradeoff likely exists.
- Short sentences. Name real components. No filler.
- If you don't have enough context to build the frame, read the code until you do. Don't guess.
"""