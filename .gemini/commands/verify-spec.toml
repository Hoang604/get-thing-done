## 9. TypeScript Quality Audit

**Only and MUST run if `$CHANGED_FILES` contains `.ts`, `.tsx`, `.js`, or `.jsx` files.**

Check for TS/JS files:

```bash
echo "$CHANGED_FILES" | grep -E '.(ts|tsx|js|jsx)$'
```

If matches exist, run audit:

> Use `ts_quality` tool with **STRICT FIDELITY** to this template.
> ⚠️ **CRITICAL: Do NOT simplify. You MUST include ALL of these tags: `<objective>`, `<output_file>`, `<files_to_scan>`, `<context>`, `<focus_areas>`.**

```
ts_quality{query: "
<objective>
Review TypeScript code quality for task: <task_name>
</objective>

<output_file>
./.gtd/<task_name>/audit/TS_QUALITY.md
</output_file>

<files_to_scan>
{TS/JS files from $CHANGED_FILES}
</files_to_scan>

<context>
Spec: ./.gtd/<task_name>/SPEC.md
</context>

<focus_areas>
- Type safety (no any)
- React hooks rules
- Async patterns
- Error handling
</focus_areas>
"}
```

---

## 10. Rust Quality Audit

**Only and MUST run if `$CHANGED_FILES` contains `.rs` files.**

Check for Rust files:

```bash
echo "$CHANGED_FILES" | grep '.rs$'
```

If Rust files exist, run audit:

> Use `rust_quality` tool with **STRICT FIDELITY** to this template.
> ⚠️ **CRITICAL: Do NOT simplify. You MUST include ALL of these tags: `<objective>`, `<output_file>`, `<files_to_scan>`, `<context>`, `<focus_areas>`.**

```
rust_quality{query: "
<objective>
Review Rust code quality for task: <task_name>
</objective>

<output_file>
./.gtd/<task_name>/audit/RUST_QUALITY.md
</output_file>

<files_to_scan>
{Rust files from $CHANGED_FILES}
</files_to_scan>

<context>
Spec: ./.gtd/<task_name>/SPEC.md
</context>

<focus_areas>
- Ownership and borrowing patterns
- Error handling (unwrap usage)
- Async patterns
- Idiomatic Rust
- Performance (unnecessary allocations)
</focus_areas>
"}
```

---

## 11. Optional Audits (Conditional)

**If async, queue, retry, timeout, external-I/O, or customer-facing production paths changed:**

> Use `observability` tool with **STRICT FIDELITY** to this template.

```
observability{query: "
<objective>
Scan for observability issues in code related to task: <task_name>
</objective>

<output_file>
./.gtd/<task_name>/audit/OBSERVABILITY.md
</output_file>

<files_to_scan>
{$CHANGED_FILES - list from git diff above}
</files_to_scan>

<context>
Spec: ./.gtd/<task_name>/SPEC.md
</context>

<focus_areas>
- trace propagation
- structured logs
- failure visibility
- metrics for important paths
</focus_areas>
"}
```

**If tests changed materially or verification confidence depends on changed tests:**

> Use `test_quality` tool with **STRICT FIDELITY** to this template.

```
test_quality{query: "
<objective>
Scan for test quality issues in code related to task: <task_name>
</objective>

<output_file>
./.gtd/<task_name>/audit/TEST_QUALITY.md
</output_file>

<files_to_scan>
{$CHANGED_FILES - list from git diff above}
</files_to_scan>

<context>
Spec: ./.gtd/<task_name>/SPEC.md
</context>

<focus_areas>
- weak assertions
- flakiness
- over-mocking
- meaningful coverage gaps
</focus_areas>
"}
```

---

## 12. Read Audit Findings

Read the generated audit reports to gather evidence for the consolidated report:

```bash
# Read all generated audit files
cat ./.gtd/<task_name>/audit/*.md
```

---

## 13. Consolidate Report

Combine all findings into a single comprehensive report.

**Action 1: Write to file**
Write to `./.gtd/<task_name>/VERIFICATION.md` using `write_file` tool.

**Action 2: Display to console**
Output the FULL content of the report in your final response so the user can read it immediately.

**Report Format:**

```markdown
# Verification Report: <task_name>

**Spec:** ./.gtd/<task_name>/SPEC.md
**Date:** {date}

---

## 1. Goal & Requirements Verification

**Ultimate Goal:** {PASS / FAIL / UNCERTAIN}
> {Evidence that goal is met}

**Requirements Status:** {PASS / FAIL / PARTIAL}

| Requirement | Status     | Evidence/Notes                                  |
| :---------- | :--------- | :---------------------------------------------- |
| {Req 1}     | ✅ PASS    | Found in `file.ts:Method`. Handles X correctly. |
| {Req 2}     | ❌ FAIL    | No code found for feature Y.                    |

**Summary:** {X}/{Y} implemented

---

## 2. Correctness Audit

**Status:** {PASS / CRITICAL / HIGH / MEDIUM}

| Finding | Severity | Location | Description |
| :------ | :------- | :------- | :---------- |
| {Issue} | HIGH     | file:line | {description} |

**Summary:** {X} issues found

---

## 3. Reliability Audit

**Status:** {PASS / CRITICAL / HIGH / MEDIUM}

| Finding | Severity | Location | Description |
| :------ | :------- | :------- | :---------- |
| {Issue} | HIGH     | file:line | {description} |

**Summary:** {X} issues found

---

## 4. Security Audit

**Status:** {PASS / CRITICAL / HIGH / MEDIUM}

| Finding | Severity | Location | Description |
| :------ | :------- | :------- | :---------- |
| {Issue} | CRITICAL | file:line | {description} |

**Summary:** {X} issues found

---

## 5. Performance Audit

**Status:** {PASS / CRITICAL / HIGH / MEDIUM}

| Finding | Impact | Location | Description |
| :------ | :----- | :------- | :---------- |
| {Issue} | HIGH   | file:line | {description} |

**Summary:** {X} issues found

---

